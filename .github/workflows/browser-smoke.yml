name: Browser smoke test (MaestroEscape live)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-smoke.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install chromium --with-deps
      - name: Inspect live Phaser scene and character
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          page.on('pageerror',error=>errors.push(error.message));
          page.on('console',msg=>{if(msg.type()==='error')errors.push(msg.text())});
          try{
            await page.goto('https://maestroescape.adam-kerek.workers.dev/?mode=single&room=maestro-solo-smoke',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(7500);
            const status=await page.evaluate(()=>{
              const scene=window.__MAESTRO_GAME__?.scene?.scenes?.find(x=>x.scene?.key==='Explore');
              const objects=scene?.children?.list||[];
              const players=objects.filter(o=>o.texture?.key==='maestro'||o.texture?.key?.startsWith('player_')).map(o=>({texture:o.texture.key,visible:o.visible,active:o.active,x:o.x,y:o.y}));
              const casino=objects.filter(o=>o.texture?.key==='casino').map(o=>({visible:o.visible,alpha:o.alpha,x:o.x,y:o.y}));
              const lobby=document.querySelector('#maestro-character-lobby');
              return {build:window.__MAESTRO_BUILD__,scene:!!scene,players,casino,lobby:lobby?getComputedStyle(lobby).display:null,screen:document.querySelector('#screen')?.getBoundingClientRect()?.toJSON(),splash:document.querySelector('#splash')?.textContent??null};
            });
            console.log('LIVE_BROWSER_STATE',JSON.stringify(status));
            console.log('BROWSER_ERRORS',JSON.stringify(errors));
            await page.screenshot({path:'maestro-live.png',fullPage:true});
            if(status.build!=='casino-browser-geometry-20261115')throw Error('Not the repaired live build');
            if(!status.scene)throw Error('Phaser Explore scene was not created');
            if(status.casino.length!==0)throw Error('Casino image objects exist outdoors: '+JSON.stringify(status.casino));
            if(!status.players.some(p=>p.visible))throw Error('No visible player sprite after startup: '+JSON.stringify(status.players));
            console.log('PASS: No casino layer on street; visible player sprite');
            // Configure a visible manhole at the normal player spawn, without modifying production settings.
            const testContext=await browser.newContext({viewport:{width:1440,height:900}});
            await testContext.addInitScript(()=>{
              localStorage.setItem('maestroescape.gameSettings.v1',JSON.stringify({
                'casino.manhole.enabled':1,
                'interaction.street_casino.x':859,
                'interaction.street_casino.y':577,
                'interaction.street_casino.radius':100,
                'transition.casino.x':808,
                'transition.casino.y':301,
                'interaction.casino_exit.x':818,
                'interaction.casino_exit.y':275,
                'interaction.casino_exit.radius':96
              }));
              localStorage.setItem('maestroescape.gameSettings.pending.v1','1');
            });
            const enterPage=await testContext.newPage();
            const enterErrors=[];
            enterPage.on('pageerror',e=>enterErrors.push(e.message));
            await enterPage.goto('https://maestroescape.adam-kerek.workers.dev/?mode=single&room=maestro-casino-enter-smoke',{waitUntil:'domcontentloaded',timeout:30000});
            await enterPage.waitForTimeout(5500);
            const inspect=()=>enterPage.evaluate(()=>{
              const scene=window.__MAESTRO_GAME__?.scene?.scenes?.find(x=>x.scene?.key==='Explore');
              const items=scene?.children?.list||[];
              return {casino:items.filter(o=>o.texture?.key==='casino'&&o.visible).length,
                street:items.filter(o=>o.texture?.key==='world'&&o.visible).length,
                prompt:document.querySelector('#npc-prompt')?.textContent,
                message:document.querySelector('#msg')?.textContent,
                character:items.filter(o=>o.texture?.key==='maestro'&&o.visible).length};
            });
            console.log('CASINO_BEFORE_E',JSON.stringify(await inspect()));
            await enterPage.keyboard.press('e');
            await enterPage.waitForTimeout(650);
            const entered=await inspect();
            console.log('CASINO_AFTER_E',JSON.stringify(entered),'ERRORS',JSON.stringify(enterErrors));
            if(!entered.casino||entered.street)throw Error('E did not enter underground casino');
            await enterPage.keyboard.press('e');
            await enterPage.waitForTimeout(650);
            const exited=await inspect();
            console.log('CASINO_AFTER_EXIT',JSON.stringify(exited));
            if(exited.casino||!exited.street)throw Error('E did not return to Mester utca');
            await testContext.close();
            console.log('PASS: Pressing E enters and exits configured casino manhole');
            // Regression: the same browser tab must pick up later settings edits before E.
            const staleContext=await browser.newContext({viewport:{width:1440,height:900}});
            const stalePage=await staleContext.newPage();
            await stalePage.goto('https://maestroescape.adam-kerek.workers.dev/?mode=single&room=maestro-casino-settings-smoke',{waitUntil:'domcontentloaded',timeout:30000});
            await stalePage.waitForTimeout(4500);
            await stalePage.evaluate(()=>{
              const key='maestroescape.gameSettings.v1';
              const old=JSON.parse(localStorage.getItem(key)||'{}');
              localStorage.setItem(key,JSON.stringify({...old,
                'casino.manhole.enabled':1,'interaction.street_casino.x':859,'interaction.street_casino.y':577,
                'interaction.street_casino.radius':90,
                'transition.casino.x':808,'transition.casino.y':301}));
            });
            await stalePage.keyboard.press('e');
            await stalePage.waitForTimeout(750);
            const refreshed=await stalePage.evaluate(()=>{
              const scene=window.__MAESTRO_GAME__?.scene?.scenes?.find(x=>x.scene?.key==='Explore');
              return {casino:scene?.children?.list.filter(o=>o.texture?.key==='casino'&&o.visible).length,
                message:document.querySelector('#msg')?.textContent};
            });
            console.log('CASINO_AFTER_SAME_TAB_SETTINGS_EDIT',JSON.stringify(refreshed));
            if(!refreshed.casino)throw Error('Casino entry did not use modified saved settings');
            await staleContext.close();
          }finally{await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-live-browser-screenshot
          path: maestro-live.png
