name: Browser smoke test (MaestroEscape live)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-smoke.yml"
      - "src/roulette-client.js"
      - "src/consumables.js"
      - "Assets/Maps/maestro_casino_v2.webp"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install chromium --with-deps
      - name: Inspect live Phaser scene and character
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          page.on('pageerror',error=>errors.push(error.message));
          page.on('console',msg=>{if(msg.type()==='error')errors.push(msg.text())});
          try{
            await page.goto('https://maestroescape.adam-kerek.workers.dev/?mode=single&room=maestro-solo-smoke',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(7500);
            const status=await page.evaluate(()=>{
              const scene=window.__MAESTRO_GAME__?.scene?.scenes?.find(x=>x.scene?.key==='Explore');
              const objects=scene?.children?.list||[];
              const players=objects.filter(o=>o.texture?.key==='maestro'||o.texture?.key?.startsWith('player_')).map(o=>({texture:o.texture.key,visible:o.visible,active:o.active,x:o.x,y:o.y}));
              const casino=objects.filter(o=>o.texture?.key==='casino').map(o=>({visible:o.visible,alpha:o.alpha,x:o.x,y:o.y}));
              const lobby=document.querySelector('#maestro-character-lobby');
              return {build:window.__MAESTRO_BUILD__,scene:!!scene,players,casino,lobby:lobby?getComputedStyle(lobby).display:null,screen:document.querySelector('#screen')?.getBoundingClientRect()?.toJSON(),splash:document.querySelector('#splash')?.textContent??null};
            });
            const casinoAsset=await page.evaluate(()=>{
              const image=window.__MAESTRO_GAME__?.scene?.scenes?.find(x=>x.scene?.key==='Explore')?.textures?.get('casino')?.getSourceImage();
              return image?{width:image.naturalWidth||image.width,height:image.naturalHeight||image.height}:null;
            });
            console.log('LIVE_CASINO_ART',JSON.stringify(casinoAsset));
            if(!casinoAsset||casinoAsset.width!==1448||casinoAsset.height!==1086)
              throw Error('Uploaded casino background is not the active game texture: '+JSON.stringify(casinoAsset));
            console.log('LIVE_BROWSER_STATE',JSON.stringify(status));
            console.log('BROWSER_ERRORS',JSON.stringify(errors));
            await page.screenshot({path:'maestro-live.png',fullPage:true});
            if(status.build!=='casino-browser-geometry-20261115')throw Error('Not the repaired live build');
            if(!status.scene)throw Error('Phaser Explore scene was not created');
            if(status.casino.length!==0)throw Error('Casino image objects exist outdoors: '+JSON.stringify(status.casino));
            if(!status.players.some(p=>p.visible))throw Error('No visible player sprite after startup: '+JSON.stringify(status.players));
            console.log('PASS: No casino layer on street; visible player sprite');
            // Configure a visible manhole at the normal player spawn, without modifying production settings.
            const testContext=await browser.newContext({viewport:{width:1440,height:900}});
            await testContext.addInitScript(()=>{
              localStorage.setItem('maestroescape.gameSettings.v1',JSON.stringify({
                'casino.manhole.enabled':1,
                'interaction.street_casino.x':859,
                'interaction.street_casino.y':577,
                'interaction.street_casino.radius':100,
                'transition.casino.x':808,
                'transition.casino.y':301,
                'interaction.casino_exit.x':818,
                'interaction.casino_exit.y':275,
                'interaction.casino_exit.radius':96
              }));
              localStorage.setItem('maestroescape.gameSettings.pending.v1','1');
            });
            const enterPage=await testContext.newPage();
            const enterErrors=[];
            enterPage.on('pageerror',e=>enterErrors.push(e.message));
            await enterPage.goto('https://maestroescape.adam-kerek.workers.dev/?mode=single&room=maestro-casino-enter-smoke',{waitUntil:'domcontentloaded',timeout:30000});
            await enterPage.waitForTimeout(5500);
            const inspect=()=>enterPage.evaluate(()=>{
              const scene=window.__MAESTRO_GAME__?.scene?.scenes?.find(x=>x.scene?.key==='Explore');
              const items=scene?.children?.list||[];
              return {casino:items.filter(o=>o.texture?.key==='casino'&&o.visible).length,
                street:items.filter(o=>o.texture?.key==='world'&&o.visible).length,
                prompt:document.querySelector('#npc-prompt')?.textContent,
                message:document.querySelector('#msg')?.textContent,
                character:items.filter(o=>o.texture?.key==='maestro'&&o.visible).length};
            });
            console.log('CASINO_BEFORE_E',JSON.stringify(await inspect()));
            await enterPage.keyboard.press('e');
            await enterPage.waitForTimeout(650);
            const entered=await inspect();
            console.log('CASINO_AFTER_E',JSON.stringify(entered),'ERRORS',JSON.stringify(enterErrors));
            if(!entered.casino||entered.street)throw Error('E did not enter underground casino');
            await enterPage.keyboard.press('e');
            await enterPage.waitForTimeout(650);
            const exited=await inspect();
            console.log('CASINO_AFTER_EXIT',JSON.stringify(exited));
            if(exited.casino||!exited.street)throw Error('E did not return to Mester utca');
            await testContext.close();
            console.log('PASS: Pressing E enters and exits configured casino manhole');
            // Regression: the same browser tab must pick up later settings edits before E.
            const staleContext=await browser.newContext({viewport:{width:1440,height:900}});
            const stalePage=await staleContext.newPage();
            await stalePage.goto('https://maestroescape.adam-kerek.workers.dev/?mode=single&room=maestro-casino-settings-smoke',{waitUntil:'domcontentloaded',timeout:30000});
            await stalePage.waitForTimeout(4500);
            await stalePage.evaluate(()=>{
              const key='maestroescape.gameSettings.v1';
              const old=JSON.parse(localStorage.getItem(key)||'{}');
              localStorage.setItem(key,JSON.stringify({...old,
                'casino.manhole.enabled':1,'interaction.street_casino.x':859,'interaction.street_casino.y':577,
                'interaction.street_casino.radius':90,
                'transition.casino.x':808,'transition.casino.y':301}));
            });
            await stalePage.keyboard.press('e');
            await stalePage.waitForTimeout(750);
            const refreshed=await stalePage.evaluate(()=>{
              const scene=window.__MAESTRO_GAME__?.scene?.scenes?.find(x=>x.scene?.key==='Explore');
              return {casino:scene?.children?.list.filter(o=>o.texture?.key==='casino'&&o.visible).length,
                message:document.querySelector('#msg')?.textContent};
            });
            console.log('CASINO_AFTER_SAME_TAB_SETTINGS_EDIT',JSON.stringify(refreshed));
            if(!refreshed.casino)throw Error('Casino entry did not use modified saved settings');
            await staleContext.close();
            // End-to-end casino bar interaction: existing pub ordering engine must work in casino.
            const beerContext=await browser.newContext({viewport:{width:1440,height:900}});
            await beerContext.addInitScript(()=>{
              localStorage.setItem('maestroescape.gameSettings.v1',JSON.stringify({
                'casino.manhole.enabled':1,'interaction.street_casino.x':859,'interaction.street_casino.y':577,
                'interaction.street_casino.radius':100,'transition.casino.x':715,'transition.casino.y':301,
                'interaction.casino_exit.x':711,'interaction.casino_exit.y':265,'interaction.casino_exit.radius':75
              }));
            });
            const beerPage=await beerContext.newPage();
            const beerErrors=[];
            beerPage.on('pageerror',e=>beerErrors.push(e.message));
            await beerPage.goto('https://maestroescape.adam-kerek.workers.dev/?mode=single&room=maestro-casino-beer-smoke',{waitUntil:'domcontentloaded',timeout:30000});
            await beerPage.waitForTimeout(5000);
            await beerPage.keyboard.press('e');
            await beerPage.waitForTimeout(500);
            await beerPage.keyboard.down('s');
            await beerPage.waitForTimeout(750);
            await beerPage.keyboard.up('s');
            await beerPage.keyboard.down('a');
            await beerPage.waitForTimeout(1680);
            await beerPage.keyboard.up('a');
            await beerPage.waitForTimeout(200);
            const bar=await beerPage.evaluate(()=>{
              const scene=window.__MAESTRO_GAME__?.scene?.scenes?.find(x=>x.scene?.key==='Explore');
              const objects=scene?.children?.list||[];
              const player=objects.filter(o=>o.texture?.key==='maestro'&&o.visible)[0];
              const npc=objects.filter(o=>o.getData?.('npcId')==='casino_bartender')[0];
              return {player:player&&{x:player.x,y:player.y},npc:npc&&{x:npc.x,y:npc.y,visible:npc.visible},
                prompt:document.querySelector('#npc-prompt')?.textContent};
            });
            console.log('CASINO_BAR_APPROACH',JSON.stringify(bar));
            if(!bar.npc?.visible)throw Error('Casino bartender is not visible');
            if(!bar.prompt?.includes('Casino Bartender'))throw Error('Casino bartender interaction prompt missing: '+JSON.stringify(bar));
            await beerPage.keyboard.press('e');
            await beerPage.waitForTimeout(400);
            const dialog=beerPage.locator('#npc-dialogue');
            if(await dialog.isHidden())throw Error('E failed to open casino bartender dialogue');
            await dialog.getByRole('button',{name:'Order beer'}).click();
            await beerPage.waitForTimeout(450);
            const message=await beerPage.locator('#npc-dialogue-message').textContent();
            console.log('CASINO_BEER_ORDER',message,'ERRORS',JSON.stringify(beerErrors));
            if(!/preparing|order|beer/i.test(message||'')||/cannot|unavailable|wrong|move closer|error/i.test(message||''))
              throw Error('Casino beer order did not succeed: '+message);
            await beerContext.close();
            console.log('PASS: Casino bartender sells beer through existing room engine');
            const rouletteContext=await browser.newContext({viewport:{width:1360,height:860}});
            await rouletteContext.addInitScript(()=>{
              localStorage.setItem('maestroescape.gameSettings.v1',JSON.stringify({
                'casino.manhole.enabled':1,'interaction.street_casino.x':859,'interaction.street_casino.y':577,
                'interaction.street_casino.radius':100,'transition.casino.x':988,'transition.casino.y':718
              }));
            });
            const roulettePage=await rouletteContext.newPage();
            const rouletteErrors=[];
            roulettePage.on('pageerror',e=>rouletteErrors.push(e.message));
            await roulettePage.goto('https://maestroescape.adam-kerek.workers.dev/?mode=single&room=maestro-roulette-smoke',{waitUntil:'domcontentloaded',timeout:30000});
            await roulettePage.waitForTimeout(4700);
            await roulettePage.keyboard.press('e');
            await roulettePage.waitForTimeout(450);
            const before=await roulettePage.evaluate(()=>{
              const scene=window.__MAESTRO_GAME__?.scene?.scenes?.find(x=>x.scene?.key==='Explore');
              const player=scene?.children?.list.find(o=>o.texture?.key==='maestro'&&o.visible);
              return {player:player&&{x:player.x,y:player.y},prompt:document.querySelector('#npc-prompt')?.textContent};
            });
            console.log('ROULETTE_BEFORE_E',JSON.stringify(before));
            if(!before.prompt?.includes('Play roulette'))throw Error('Roulette hotspot not reachable: '+JSON.stringify(before));
            await roulettePage.keyboard.press('e');
            await roulettePage.waitForTimeout(300);
            const overlay=roulettePage.locator('#maestro-roulette');
            if(!(await overlay.isVisible()))throw Error('E failed to open roulette UI');
            if((await roulettePage.locator('#roulette-board [data-bet]').count())!==44)throw Error('Unexpected roulette betting cell count');
            if(await roulettePage.locator('#roulette-spin').isEnabled())throw Error('Spin without inventory stakes should be disabled');
            await roulettePage.locator('#roulette-exit').click();
            if(await overlay.isVisible())throw Error('Roulette close failed');
            if(rouletteErrors.length)throw Error('Roulette page errors: '+JSON.stringify(rouletteErrors));
            console.log('PASS: roulette opens on E with 37 numbers + 7 outside bets and closes correctly');
            // Seed one non-monetary inventory item in this isolated test room, then
            // exercise browser drag/drop, a full spin and actual inventory settlement.
            await roulettePage.waitForTimeout(1800);
            const seeded=await roulettePage.evaluate(()=>{
              const key=Object.keys(localStorage).find(k=>k.includes('maestroescape.singleRoom.v1.')&&k.includes('maestro-roulette-smoke'));
              if(!key)return {error:'No saved local room'};
              const room=JSON.parse(localStorage.getItem(key)||'null');
              const p=Object.values(room?.players||{})[0];
              if(!p)return {error:'No player saved'};
              const id='roulette_test_stake';
              room.items=room.items.filter(i=>i.id!==id);
              room.items.push({id,type:'beer',generation:0,remainingUnits:1,maxUnits:1,
                location:{kind:'inventory',playerId:p.id,slot:99},lit:false,revision:0});
              localStorage.setItem(key,JSON.stringify(room));
              return {key,id,playerId:p.id};
            });
            console.log('ROULETTE_SEED',JSON.stringify(seeded));
            if(seeded.error)throw Error(seeded.error);
            await roulettePage.reload({waitUntil:'domcontentloaded'});
            await roulettePage.waitForTimeout(5000);
            await roulettePage.keyboard.press('e');
            await roulettePage.waitForTimeout(350);
            await roulettePage.keyboard.press('e');
            await roulettePage.waitForTimeout(300);
            const card=roulettePage.locator('#roulette-inventory [data-item-id="roulette_test_stake"]');
            if(!(await card.isVisible()))throw Error('Seeded inventory item not visible below roulette board');
            await card.dragTo(roulettePage.locator('#roulette-board [data-bet="red"]'));
            if(!(await roulettePage.locator('#roulette-spin').isEnabled()))throw Error('Dragging an item to red did not register the stake');
            await roulettePage.locator('#roulette-spin').click();
            await roulettePage.waitForTimeout(3700);
            const outcome=await roulettePage.locator('#roulette-result').textContent();
            const note=await roulettePage.locator('#roulette-message').textContent();
            const remaining=await roulettePage.locator('#roulette-inventory [data-item-id]').count();
            console.log('ROULETTE_E2E_SPIN',JSON.stringify({outcome,note,remaining}));
            if(!/\\b(?:[0-9]|[12][0-9]|3[0-6]) (?:RED|BLACK|GREEN)\\b/.test(outcome||''))
              throw Error('Missing roulette result animation outcome: '+outcome);
            const winning=/ RED$/.test(outcome||'');
            if(remaining!==(winning?2:0))throw Error('Incorrect inventory payout for result: '+JSON.stringify({outcome,remaining,note}));
            console.log('PASS: Dragged inventory item, animated spin and settled European roulette payout');

            await rouletteContext.close();


          }finally{await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-live-browser-screenshot
          path: maestro-live.png
