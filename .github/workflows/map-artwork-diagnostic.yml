name: Diagnose source map artwork
on:
  push:
    branches: [main]
    paths: [".github/workflows/map-artwork-diagnostic.yml", "Assets/Maps/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy --quiet
      - name: Check outdoor source image for casino artwork
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          base='Assets/Maps/'
          world=Image.open(base+'maestro_map_new.webp').convert('RGB')
          casino=Image.open(base+'maestro_casino.webp').convert('RGB')
          old=Image.open(base+'maestro_map.webp').convert('RGB')
          print('WORLD',world.size,'CASINO',casino.size,'OLD WORLD',old.size)
          a=np.asarray(world,dtype=np.float32)
          for w in [320,400,480,520,600,640,648,700,800]:
            h=round(w*casino.height/casino.width)
            if w>world.width or h>world.height:continue
            c=np.asarray(casino.resize((w,h)),dtype=np.float32)
            patch=a[:h,:w]
            mae=np.abs(c-patch).mean()
            diff=(c-patch)
            rmse=np.sqrt((diff*diff).mean())
            print('TOPLEFT casino size',w,h,'MAE',round(float(mae),2),'RMSE',round(float(rmse),2))
          print('WORLD CORNERS', [world.getpixel(p) for p in [(0,0),(30,30),(world.width//2,world.height//2)]])
          print('CASINO CORNERS', [casino.getpixel(p) for p in [(0,0),(30,30),(casino.width//2,casino.height//2)]])
          PY
