name: Verify MaestroEscape multiplayer invite
on:
  push:
    branches: [main]
    paths:
      - "src/worker.js"
      - "src/consumables-client.js"
      - "wrangler.toml"
      - ".github/workflows/verify-multiplayer.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Confirm the actual game opens multiplayer in a browser
        run: |
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";
          const browser=await chromium.launch({headless:true});
          const address="https://maestroescape.adam-kerek.workers.dev/?room=maestro-party-20261117&mode=multi";
          try {
            const context=await browser.newContext({viewport:{width:1440,height:900}});
            const page=await context.newPage();
            const errors=[];
            page.on("pageerror",e=>errors.push(e.message));
            await page.goto(address,{waitUntil:"commit",timeout:45000});
            await page.waitForSelector("#maestro-mode-button",{timeout:25000});
            await page.waitForFunction(()=>{
              const lobby=document.querySelector("#maestro-character-lobby");
              return lobby&&lobby.textContent.includes("Choose your character");
            },undefined,{timeout:25000});
            const mode=await page.locator("#maestro-mode-button").textContent();
            const lobby=await page.locator("#maestro-character-lobby").textContent();
            assert.match(mode,/Multiplayer/,"The browser was forced into single-player");
            assert.match(lobby,/MULTIPLAYER INVITE ROOM/,"Wrong character lobby");
            assert.equal(new URL(page.url()).searchParams.get("mode"),"multi");
            // The floating panel works without navigating away from Phaser.
            const toggle=page.locator("#maestro-live-settings-button");
            await toggle.waitFor({state:"visible",timeout:20000});
            await toggle.click();
            const panel=page.locator("#maestro-live-settings-panel");
            assert.equal(await panel.isVisible(),true,"Live settings panel did not open");
            const player=panel.getByRole("slider",{name:"Player size"});
            const original=await player.inputValue();
            const next=original==="0.54"?"0.56":"0.54";
            await player.fill(next);
            const stored=await page.evaluate(()=>({
              value:JSON.parse(localStorage.getItem("maestroescape.gameSettings.v1")||"{}")["character.streetScale"],
              pending:localStorage.getItem("maestroescape.gameSettings.pending.v1")
            }));
            assert.equal(Number(stored.value),Number(next),"Live setting failed to save");
            assert.equal(stored.pending,"1","Local settings update not marked pending");
            await player.fill(original);
            await panel.getByRole("button",{name:"Close live settings"}).click();
            assert.equal(await panel.isVisible(),false,"Live settings window did not close");
            console.log("PASS: Compact live settings open, apply, save, restore and close");
            if(errors.length)throw Error("Browser errors: "+errors.join(" | "));
            console.log("PASS: Browser remains in multiplayer mode and shows real character lobby");
            await context.close();
          } finally { await browser.close() }
          JS
      - name: Verify two players share one live Cloudflare room
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          const base="https://maestroescape.adam-kerek.workers.dev";
          const room="maestro-party-20261117";
          const endpoint=base+"/api/consumables?room="+room;
          const a="smokemultiplayerfirstpeer20261117";
          const b="smokemultiplayersecondpeer20261117";
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          let health;
          for(let i=0;i<18;i++){
            try{
              const resp=await fetch(base+"/health",{cache:"no-store"});
              health=await resp.json();
              if(resp.ok&&health.multiplayerEnabled&&health.multiplayerRoom===room)break;
            }catch(error){console.log("Waiting for Cloudflare:",String(error))}
            await pause(5000);
          }
          assert.equal(health?.multiplayerEnabled,true,"Live worker did not receive multiplayer build");
          console.log("HEALTH",JSON.stringify(health));
          const get=async token=>{
            const res=await fetch(endpoint+"&token="+token,{cache:"no-store"});
            const body=await res.json();
            assert.equal(res.ok,true,JSON.stringify(body));
            assert.equal(body.snapshot?.playerId!==undefined,true,JSON.stringify(body));
            return body;
          };
          const first=await get(a);
          const second=await get(b);
          const again=await get(a);
          assert.notEqual(first.snapshot.playerId,second.snapshot.playerId,"Two clients were assigned the same identity");
          const playerIds=again.snapshot.players.map(x=>x.id);
          assert.ok(playerIds.includes(first.snapshot.playerId)&&playerIds.includes(second.snapshot.playerId),
            "Two clients do not see the same room player list");
          assert.equal(first.snapshot.roomCreatedAt,second.snapshot.roomCreatedAt,
            "Two clients did not connect to the same authoritative room");
          const query=new URL(base+"/?room="+room+"&mode=multi");
          const html=await (await fetch(query)).text();
          assert.ok(html.includes("Maestro"),"The game was not served");
          console.log("PASS: Shared room with two independent clients, createdAt",first.snapshot.roomCreatedAt);
          console.log("INVITE",query.toString());
          JS
