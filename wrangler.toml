name = "maestroescape"
main = "src/worker.js"
compatibility_date = "2026-11-12"

# Keep the original migration in history, even though this prototype no
# longer uses Durable Objects. Wrangler applies migrations in order.
[[migrations]]
tag = "maestro-escape-v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "maestro-escape-remove-gameroom-v2"
deleted_classes = ["GameRoom"]

[[durable_objects.bindings]]
name = "SETTINGS_STORE"
class_name = "GameSettings"

[[migrations]]
tag = "maestro-escape-shared-settings-v3"
new_sqlite_classes = ["GameSettings"]
