name = "maestroescape"
main = "src/worker.js"
compatibility_date = "2026-11-12"

# Keep the original migration in history, even though this prototype no
# longer uses Durable Objects. Wrangler applies migrations in order.
[[migrations]]
tag = "maestro-escape-v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "maestro-escape-remove-gameroom-v2"
deleted_classes = ["GameRoom"]

[[durable_objects.bindings]]
name = "SETTINGS_STORE"
class_name = "GameSettings"

[[migrations]]
tag = "maestro-escape-shared-settings-v3"
new_sqlite_classes = ["GameSettings"]

# One invite-only multiplayer room, reusing the existing ConsumableRoom migration.
[[durable_objects.bindings]]
name = "ITEM_ROOMS"
class_name = "ConsumableRoom"

# Existing SQLite Durable Object migration remains unchanged.

[[migrations]]
tag = "maestro-consumables-v4"
new_sqlite_classes = ["ConsumableRoom"]

# MaestroEscape accounts now use Supabase Auth. The original migration remains for history.

[[migrations]]
tag = "maestro-accounts-v5"
new_sqlite_classes = ["MaestroAccounts"]
